name: Setup Ngrok and Remote Desktop (Final Stable)

on:
  workflow_dispatch:  # Manual trigger only

jobs:
  setup-ngrok-rdp:
    runs-on: windows-latest
    timeout-minutes: 360  # 6 hours

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Ngrok (with retry)
        run: |
          $retries = 5
          while ($retries -gt 0) {
            try {
              Invoke-WebRequest "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip" -OutFile ngrok.zip -UseBasicParsing
              if (Test-Path "ngrok.zip") { break }
            } catch {
              Write-Host "Retrying... $retries left"
            }
            Start-Sleep -Seconds 5
            $retries--
          }
          if (!(Test-Path "ngrok.zip")) { throw "❌ Failed to download ngrok!" }

      - name: Extract Ngrok
        run: |
          Expand-Archive ngrok.zip -DestinationPath .
          if (!(Test-Path ".\ngrok.exe")) { throw "❌ Extraction failed!" }

      - name: Update Ngrok
        run: .\ngrok.exe update

      - name: Authenticate Ngrok
        run: .\ngrok.exe authtoken $Env:NGROK_AUTH_TOKEN
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}

      - name: Enable Remote Desktop
        run: |
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "UserAuthentication" -Value 1

      - name: Set Password for runneradmin
        run: |
          $user = Get-LocalUser -Name "runneradmin"
          if ($user.Enabled -eq $false) { Enable-LocalUser -Name "runneradmin" }
          $secPass = ConvertTo-SecureString "P@ssw0rd!" -AsPlainText -Force
          Set-LocalUser -Name "runneradmin" -Password $secPass

      - name: Start Ngrok TCP Tunnel
        run: |
          Start-Process -FilePath .\ngrok.exe -ArgumentList "tcp 3389 --log=ngrok.log --log-format=logfmt --log-level=debug --inspect=true" -WindowStyle Hidden
          Start-Sleep -Seconds 15

      - name: Fetch Ngrok Tunnel Info
        run: |
          $retries = 15
          while ($retries -gt 0) {
            try {
              $response = Invoke-RestMethod -Uri "http://127.0.0.1:4040/api/tunnels"
              $tcp = ($response.tunnels | Where-Object { $_.proto -eq "tcp" }).public_url
              if ($tcp) {
                $host,$port = $tcp -replace "tcp://","" -split ":"
                Write-Output "✅ RDP Connection Details:"
                Write-Output "Host: $host"
                Write-Output "Port: $port"
                Write-Output "Username: runneradmin"
                Write-Output "Password: P@ssw0rd!"
                break
              }
            } catch { }
            Write-Host "⏳ Retrying fetch... ($retries left)"
            Start-Sleep -Seconds 6
            $retries--
          }
          if (-not $tcp) { Write-Host "⚠️ Could not fetch tunnel info, check ngrok.log artifact." }

      - name: Upload Ngrok Logs
        uses: actions/upload-artifact@v4
        with:
          name: ngrok-logs
          path: ngrok.log

      - name: Keep Alive (6 hours)
        run: |
          for ($i = 0; $i -lt 72; $i++) {
            Write-Host "⏳ Workflow alive... Minute: $($i*5)"
            Start-Sleep -Seconds 300
          }
        continue-on-error: true
